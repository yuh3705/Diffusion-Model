dataset_params:
  # Point this to the folder that contains CelebHQ image files.
  # Kaggle example: '/kaggle/input/celeba-hq-resized-256x256/celeba_hq_256'
  im_path: 'data/celeb'
  im_channels: 3
  im_size: 64
  im_exts: ['jpg']
  name: 'celebhq'

diffusion_params:
  num_timesteps: 1000
  beta_start: 0.0015
  beta_end: 0.0195

model_params:
  time_emb_dim: 128
  norm_channels: 8
  down_channels: [64, 128, 256, 256]
  mid_channels: [256, 256]
  down_sample: [True, True, True]
  attn_down: [False, False, True]
  num_heads: 8
  conv_out_channels: 64
  num_down_layers: 2
  num_mid_layers: 2
  num_up_layers: 2

train_params:
  seed: 1111
  task_name: 'celebhq'
  batch_size: 8
  num_workers: 2
  num_epochs: 100
  num_samples: 16   
  num_grid_rows: 4
  sample_save_steps: 1
  lr: 0.00002
  ckpt_name: 'ddpm_celebhq_64.pth'
